[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scry-social"
version = "0.1.0"
description = "Let an LLM see TikTok and Instagram: CPU-only pipeline for transcripts, on-screen text, metadata, and comment consensus."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "matteo" }]
keywords = ["tiktok", "instagram", "social-media", "llm", "stt", "ocr"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
]
dependencies = [
    "yt-dlp>=2025.1.1",
    "curl_cffi==0.15.0",   # pinned: yt-dlp supports 0.5.10 or 0.10.x-0.15.x
    "camoufox[geoip]>=0.5",
    "faster-whisper>=1.1",
    "rapidocr>=3.0",
    "onnxruntime>=1.17",
    "httpx>=0.27",
    "gallery-dl>=1.29",
]

[project.scripts]
scry = "scry.cli:main"

[project.urls]
Homepage = "https://github.com/matteo/scry"

[tool.setuptools]
packages = ["scry"]
